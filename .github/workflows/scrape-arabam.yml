name: Arabam.com Günlük Batch

on:
  # arabam.com datacenter IP'lerini blokluyor — lokalde çalıştır, sync_to_arachesap.bat kullan
  workflow_dispatch:
    inputs:
      group:
        description: 'Grup numarası (0-13, boş = otomatik)'
        required: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # max 5 saat
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: listings.db önbelleği restore et
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: listings.db
          key: arabam-db-${{ github.run_number }}
          restore-keys: |
            arabam-db-

      - name: Scrape başlat
        run: |
          cd arabam
          if [ -n "${{ github.event.inputs.group }}" ]; then
            python ../daily_batch.py --group ${{ github.event.inputs.group }}
          else
            python ../daily_batch.py
          fi

      - name: listings.db önbelleği kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: listings.db
          key: arabam-db-${{ github.run_number }}

      - name: Veri değişti mi kontrol et
        id: check
        run: |
          if [ -f data/listings.json ]; then
            echo "CHANGED=true" >> $GITHUB_ENV
          else
            echo "CHANGED=false" >> $GITHUB_ENV
          fi

      - name: arachesap repo'suna pushla
        if: env.CHANGED == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:${GH_PAT}@github.com/angunsidar/arachesap.git /tmp/arachesap
          cp data/listings.json /tmp/arachesap/data/listings.json
          if [ -f data/depr.json ]; then
            cp data/depr.json /tmp/arachesap/data/depr.json
          fi
          cd /tmp/arachesap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings.json data/depr.json
          if git diff --cached --quiet; then
            echo "Veri değişmedi, commit atlanıyor."
          else
            git commit -m "data: arabam batch güncellendi $(date +%Y-%m-%d)"
            git push
            echo "DEPLOYED=true" >> $GITHUB_ENV
          fi

      - name: Firebase deploy
        if: env.DEPLOYED == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          npm install -g firebase-tools
          cd /tmp/arachesap
          firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }} --non-interactive
